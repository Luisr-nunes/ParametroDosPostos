[package]
name = "parser_pmqc"
description = "Parser de dados do PMQC (Programa de Monitoramento da Qualidade dos Combustíveis)"
version.workspace = true
edition.workspace = true

[dependencies]
core_db = { version = "0.1.0", path = "../core_db" }
tokio = { version = "1.52.1", features = ["rt", "macros", "sync"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
