[package]
name = "scraper_anp"
description = "Coletores e pipelines de ingestão de dados da ANP"
version.workspace = true
edition.workspace = true

[dependencies]
core_db = { version = "0.1.0", path = "../core_db" }
polars = { version = "0.53.0", features = ["lazy", "csv"] }
reqwest = { version = "0.13.2", features = ["json", "cookies"] }
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.52.1", features = ["rt", "macros", "sync", "io-util"] }
