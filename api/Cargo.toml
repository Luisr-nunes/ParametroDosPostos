[package]
name = "api"
description = "API REST para consulta de postos de combustível (Axum)"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8.9"
core_db = { version = "0.1.0", path = "../core_db" }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.52.1", features = ["rt", "macros", "sync", "io-util"] }
tower-http = { version = "0.6.8", features = ["cors"] }
